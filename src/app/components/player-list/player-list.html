<div class="player-list">
    <div class="lobby-text">Spielerliste:</div>
    @for(player of lobbyService.activeLobby()?.players; track player.id) {
    <div class="player-row">
        <div class="player-active {{ player.connected ? 'active': 'inactive'}}"></div>
        <div class="player-name">{{ player.username }}</div>
        <div class="player-score">0</div>
    </div>
    }
</div>
